name: Strategy Research (No Trades)
on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday research snapshot. Never submits paper or live orders.
    - cron: '0 15 * * 0'
permissions:
  contents: read
concurrency:
  group: horsesdontstop-strategy-research
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate research engine
        run: python -m pytest -q tests/test_strategy_research.py
      - name: Compare fixed strategies on historical paper-data credentials
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: python -m bot.strategy_research_cli --days 730
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-research-${{ github.run_id }}
          path: .state/strategy-comparison.json
          if-no-files-found: ignore
          retention-days: 14

name: Verify PAPER Executor Secret (Read Only)
on:
  workflow_dispatch:
  # One-time CI check on initial merge. Future checks are manual.
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-paper-executor-secret.yml

permissions:
  contents: read

concurrency:
  group: horsesdontstop-paper-executor-credential-check
  cancel-in-progress: false

jobs:
  verify-writer-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate the verification code without network access
        run: |
          python -m pytest -q \
            tests/test_paper_executor_preflight.py \
            tests/test_paper_execution_journal.py
      - name: Verify writer DSN and locked trading controls, no writes
        env:
          PAPER_EXECUTOR_DSN: ${{ secrets.PAPER_EXECUTOR_DSN }}
        run: |
          python -m bot.paper_executor_preflight
